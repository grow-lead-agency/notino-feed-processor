# notino-feed-processor — Docker Compose
# Deploy jako Coolify "Docker Compose" service na growlead-node-03 (CPX62: 16 cores, 32 GB RAM)
#
# Architecture:
#   Redis (queue) → BullMQ scheduler (dispatches jobs) → Workers (scrape + upsert)
#   Supercronic still runs for simple cron jobs (sitemap diff, cleanup)
#
# NEON DB: external (Neon Launch plan, 10 GB)

services:
  # ============================================================
  # REDIS — job queue backend
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: notino-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # BULLMQ BOARD — web UI for queue monitoring
  # ============================================================
  bull-board:
    image: deadly0/bull-board:latest
    container_name: notino-bull-board
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BULL_PREFIX=notino
      - PORT=3000
    ports:
      - "3088:3000"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

  # ============================================================
  # FEED PROCESSOR — scrapers + queue workers
  # ============================================================
  feed-processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: notino-feed-processor:latest
    container_name: notino-feed-processor
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

    labels:
      - coolify.managed=true
      - coolify.type=service
      - coolify.service.name=notino-feed-processor

    environment:
      # Neon PostgreSQL
      - DATABASE_URL=${DATABASE_URL}
      # Redis (internal docker network)
      - REDIS_URL=redis://redis:6379/0
      # Affiliate APIs
      - AWIN_API_KEY=${AWIN_API_KEY:-}
      - CJ_API_KEY=${CJ_API_KEY:-}
      # Firecrawl managed scraping
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1

    volumes:
      - feed-processor-cache:/app/cache
      - feed-processor-logs:/app/logs
      - feed-processor-feeds:/app/feeds
      - feed-processor-config:/app/config

    # Scraper = primary workload on CPX62
    deploy:
      resources:
        limits:
          cpus: "14.0"
          memory: 24G
        reservations:
          cpus: "4.0"
          memory: 4G

    healthcheck:
      test: ["CMD", "python", "-c", "import psycopg2; import os; psycopg2.connect(os.environ['DATABASE_URL'])"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  redis-data:
    driver: local
  feed-processor-cache:
    driver: local
  feed-processor-logs:
    driver: local
  feed-processor-feeds:
    driver: local
  feed-processor-config:
    driver: local
