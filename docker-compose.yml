# notino-feed-processor — Docker Compose
# Deploy jako Coolify "Docker Compose" service na growlead-node-03
# Node-03 je nejvolnější node (datové pipeline patří tam)
#
# NEON DB: external (nepotřebujeme local DB)
# Persistent volumes: cache, logs, feeds, config

services:
  feed-processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: notino-feed-processor:latest
    container_name: notino-feed-processor
    restart: unless-stopped

    # Coolify labels — no public port needed (cron only)
    labels:
      - coolify.managed=true
      - coolify.type=service
      - coolify.service.name=notino-feed-processor

    environment:
      # Neon PostgreSQL
      - DATABASE_URL=${DATABASE_URL}
      # Affiliate APIs (optional — activate after registration)
      - AWIN_API_KEY=${AWIN_API_KEY:-}
      - CJ_API_KEY=${CJ_API_KEY:-}
      # Firecrawl managed scraping (hard/protected shops — CF challenge, DataDome)
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1

    volumes:
      - feed-processor-cache:/app/cache
      - feed-processor-logs:/app/logs
      - feed-processor-feeds:/app/feeds
      - feed-processor-config:/app/config

    # Resource limits — node-03 has 8 cores, 15 GB RAM
    # Full scrape: 15 workers × 12K URLs per shop = needs CPU + RAM
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 1G

    healthcheck:
      test: ["CMD", "python", "-c", "import psycopg2; import os; psycopg2.connect(os.environ['DATABASE_URL'])"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  feed-processor-cache:
    driver: local
  feed-processor-logs:
    driver: local
  feed-processor-feeds:
    driver: local
  feed-processor-config:
    driver: local
